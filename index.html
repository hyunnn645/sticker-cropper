<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스티커 자동 자르기 (여백 0)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            padding: 20px;
            color: #333;
        }
        h2 { margin-top: 0; }
        .upload-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: block;
            margin-top: 10px;
            padding: 10px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        #output {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .sticker-card {
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 투명 배경 확인용 체크무늬 */
        .sticker-card img {
            max-width: 150px;
            max-height: 150px;
            margin-bottom: 12px;
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee), 
                              linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
        }
        .download-btn {
            background-color: #007aff;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="upload-box">
        <h2>✂️ 스티커 자동 분리 도구</h2>
        <p>프로크리에이트에서 <strong>배경을 투명하게 설정하여 저장한 PNG 파일</strong>을 업로드하세요. 여백 없이 딱 맞게 잘라줍니다.<br>
        (아이패드에서는 이미지를 길게 눌러 사진 앱에 직접 저장할 수 있습니다.)</p>
        <input type="file" id="uploadInput" accept="image/png">
    </div>

    <div id="output"></div>

    <script>
        document.getElementById('uploadInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = function() {
                // 원본 이미지를 그릴 캔버스 생성
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                const width = canvas.width;
                const height = canvas.height;
                
                // 픽셀 방문 여부 체크 배열
                const visited = new Uint8Array(width * height);
                const rects = []; // 잘라낼 사각형 좌표들

                // 픽셀 단위로 스티커 덩어리 찾기 (BFS 알고리즘)
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const pIdx = y * width + x;
                        if (visited[pIdx]) continue;

                        const alpha = data[pIdx * 4 + 3];
                        // 투명한 픽셀(알파값 10 미만)은 배경으로 간주하고 건너뜀
                        if (alpha < 10) {
                            visited[pIdx] = 1;
                            continue;
                        }

                        // 새로운 스티커 픽셀 발견 시 연결된 영역 탐색
                        let minX = x, maxX = x, minY = y, maxY = y;
                        const queue = [pIdx];
                        visited[pIdx] = 1;
                        
                        let area = 0;
                        let head = 0; // 큐 성능 최적화를 위한 포인터

                        while (head < queue.length) {
                            const curr = queue[head++];
                            area++;
                            
                            const cx = curr % width;
                            const cy = Math.floor(curr / width);

                            // Bounding Box (여백 0 사각형) 좌표 갱신
                            if (cx < minX) minX = cx;
                            if (cx > maxX) maxX = cx;
                            if (cy < minY) minY = cy;
                            if (cy > maxY) maxY = cy;

                            // 상하좌우 픽셀 확인
                            const neighbors = [curr - width, curr + width, curr - 1, curr + 1];
                            for (let i = 0; i < 4; i++) {
                                const n = neighbors[i];
                                // 캔버스 범위 이탈 방지
                                if (n < 0 || n >= width * height) continue;
                                // 좌우 가장자리 픽셀 이탈 방지
                                if (i === 2 && curr % width === 0) continue; 
                                if (i === 3 && curr % width === width - 1) continue; 

                                if (!visited[n]) {
                                    visited[n] = 1;
                                    // 불투명한 픽셀이면 큐에 추가하여 탐색 이어나감
                                    if (data[n * 4 + 3] >= 10) {
                                        queue.push(n);
                                    }
                                }
                            }
                        }

                        // 노이즈(먼지) 제외: 100픽셀 이상인 덩어리만 저장
                        if (area > 100) {
                            rects.push({x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1});
                        }
                    }
                }

                // 결과물 화면에 출력
                const output = document.getElementById('output');
                output.innerHTML = ''; // 기존 화면 초기화
                
                rects.forEach((rect, index) => {
                    const cropCanvas = document.createElement('canvas');
                    cropCanvas.width = rect.w;
                    cropCanvas.height = rect.h;
                    const cropCtx = cropCanvas.getContext('2d');
                    
                    // 원본에서 딱 맞는 사각형(여백 0)만큼 복사
                    cropCtx.putImageData(ctx.getImageData(rect.x, rect.y, rect.w, rect.h), 0, 0);

                    const dataUrl = cropCanvas.toDataURL("image/png");

                    // UI 요소 생성
                    const card = document.createElement('div');
                    card.className = 'sticker-card';

                    const resultImg = document.createElement('img');
                    resultImg.src = dataUrl;

                    const downloadBtn = document.createElement('a');
                    downloadBtn.href = dataUrl;
                    downloadBtn.download = `sticker_${String(index + 1).padStart(2, '0')}.png`;
                    downloadBtn.textContent = '저장하기';
                    downloadBtn.className = 'download-btn';

                    card.appendChild(resultImg);
                    card.appendChild(downloadBtn);
                    output.appendChild(card);
                });
            };
            img.src = URL.createObjectURL(file);
        });
    </script>
</body>
</html>
